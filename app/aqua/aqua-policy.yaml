---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/policy.json
# aqua Policy
# https://aquaproj.github.io/
registries:
  - type: standard
    ref: semver(">= 3.0.0")
  - name: nimble-tools
    type: github_content
    repo_owner: attakei
    repo_name: nimble-tools
    path: registry.yaml
  - name: local/copilot-cli
    type: local
    path: registry/copilot-cli.yaml
  - name: local/gigi
    type: local
    path: registry/gigi.yaml
  - name: attakei/age
    type: github_content
    repo_owner: attakei
    repo_name: age
    path: registry.yaml
  - name: attakei-lab/atskkserv
    type: github_content
    repo_owner: attakei-lab
    repo_name: atskkserv
    path: aqua/registry.yaml
packages:
  - registry: standard
  - registry: nimble-tools
  - registry: local/copilot-cli
  - registry: local/gigi
  - registry: attakei/age
  - registry: attakei-lab/atskkserv
