# ------
# Tasks to manage global applications by aqua.
# ------
version: '3'

tasks:
  create-dictionary:
    desc: 'Add global application.'
    cmds:
      - 'uv run ./scripts/create-dictionary.py ./settings.toml'
  service-windows-*:
    vars:
      SUBCOMMAND: '{{index .MATCH 0}}'
    cmd: 'uv run ./scripts/manage-for-windows.py {{.SUBCOMMAND}} ./settings.toml'
  service-windows-reload:
    desc: 'reload process to use updated dictionary.'
    cmds:
      - task: 'service-windows-stop'
      - task: 'service-windows-delete'
      - task: 'service-windows-create'
      - task: 'service-windows-start'
