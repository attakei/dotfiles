# ------
# Tasks to manage global applications by aqua.
# ------
version: '3'

tasks:
  create-dict:
    desc: 'Add global application.'
    cmds:
      - 'uv run ./create-dict.py'
  test-server:
    desc: 'Run serfer for testing.'
    cmd: 'yaskkserv2 --google-suggest var/dict.yaskkserv2 {{.CLI_ARGS}}'
