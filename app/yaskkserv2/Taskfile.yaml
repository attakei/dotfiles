# ------
# Tasks to manage global applications by aqua.
# ------
version: '3'

tasks:
  create-dictionary:
    desc: 'Add global application.'
    cmds:
      - 'uv run ./scripts/create-dictionary.py ./settings.toml'
  test-server:
    desc: 'Run serfer for testing.'
    cmd: 'yaskkserv2 --google-suggest var/dict.yaskkserv2 {{.CLI_ARGS}}'
  create-service-windows:
    cmds:
      - 'uv run ./scripts/manage-service.py create ./settings.toml --target=windows'
  start-service-windows:
    cmds:
      - 'uv run ./scripts/manage-service.py start ./settings.toml --target=windows'
  stop-service-windows:
    cmds:
      - 'uv run ./scripts/manage-service.py stop ./settings.toml --target=windows'
  reload-service-windows:
    desc: 'reload process to use updated dictionary.'
    cmds:
      - task: 'stop-service-windows'
      - task: 'start-service-windows'
  delete-service-windows:
    cmds:
      - task: 'stop-service-windows'
      - 'uv run ./scripts/manage-service.py delete ./settings.toml --target=windows'
