version: '3'

includes:
  aqua:
    taskfile: './app/aqua/Taskfile.yaml'
    dir: './app/aqua'
  scoop:
    taskfile: './app/Scoop/Taskfile.yaml'
    dir: './app/scoop'
  skk:
    taskfile: './app/atskkserv/Taskfile.yaml'
    dir: './app/atskkserv'
  docs:
    taskfile: 'https://github.com/attakei/workspace-configs.git//projects/sphinx-doc/Taskfile.yaml?tag=v0.6.0'
    vars:
      RUN_PYTHON: 'uv run'
      SPHINX_ROOT_DIR: 'docs'
      SPHINX_SOURCE_DIR: ''
      SPHINX_OUTPUT_DIR: '_build'
      SPHINX_DEFAULT_BUILDER: 'dirhtml'

tasks:
  update:
    desc: 'Update env'
    dotenv:
      - '.env'
    cmds:
      - 'git pull'
      - task: 'aqua:link'
      - task: 'scoop:import'
        if: '{{eq .GOOS "windows"}}'
      - 'nu scripts/setup.nu'
      # Sync Neovim plugins to the commits pinned in lazy-lock.json
      - |
        if command -v nvim >/dev/null 2>&1; then
          nvim --headless '+Lazy! restore' +qa
          # SKK profile: init.lua copies its pins from the main lockfile first.
          # `-u` resolves to the same data dir as NVIM_APPNAME=nvim/SKK.
          nvim --headless -u app/NeoVim/SKK/init.lua '+Lazy! restore' +qa
        fi
      - 'nu scripts/sync-uv-tools.nu'
      - 'nu scripts/sync-bun-tools.nu'
      - |
        if [ "$USE_NIMBLE" = "1" ]; then
          nimble build
        fi
  zed-push:
    desc: 'Push Zed settings'
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - >
        {{.ZED_SYNC_SETTINGS}}
        --exclude=wsl_connections
        ./root/.config/zed/settings.base.json
        ./root/.config/zed/settings.json
  zed-pull:
    desc: 'Pull Zed settings'
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - >
        {{.ZED_SYNC_SETTINGS}}
        --exclude=wsl_connections
        ./root/.config/zed/settings.json
        ./root/.config/zed/settings.base.json

vars:
  ZED_SYNC_SETTINGS:
    sh: |
      if [ -f .bin/zed-settings ]; then
        echo ".bin/zed-settings"
      elif [ -f .bin/zed-settings.exe ]; then
        echo ".bin/zed-settings.exe"
      else
        echo "uv run scripts/zed-settings.py"
      fi
